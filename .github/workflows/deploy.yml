name: Atualizar e publicar
on:
  schedule: [{ cron: '7 * * * *' }]   # a cada hora
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node build.mjs
      - name: Salvar historico de noticias
        run: |
          git config user.name "radar-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/articles.json
          git diff --cached --quiet || (git commit -m "chore: atualiza noticias [skip ci]" && git push)
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
